[project]
name = "mirrordash-clock"
version = "1.1.1"
description = "Clock module for MirrorDash"
requires-python = ">=3.14"
# The mirror provides the rest (rendering, fetch_json, translations); add only what plugin.py imports
dependencies = []

[project.entry-points."mirrordash.modules"]
mirrordash_clock = "mirrordash_clock.plugin:ClockModule"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # The look tests render clock.html as the mirror does and run it in a real browser
    "jinja2==3.1.6",
    "playwright==1.61.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirrordash_clock"]
