<div class="clock-container" id="clock-module-container"
     data-format="{{ format }}"
     data-show-seconds="{{ show_seconds|lower }}"
     data-lang="{{ lang }}"
     data-timezone="{{ timezone }}"
     data-date-format="{{ date_format }}">
    {% if show_header and translations and translations.title %}
    <h2 class="module-header" style="margin-bottom: 5px;">{{ translations.title }}</h2>
    {% endif %}
    <div class="clock-time">
        <span class="clock-hm display-xl">--:--</span>{% if show_seconds %}<span class="clock-s headline-md text-dimmed">::--</span>{% endif %}{% if format == "12h" %}<span class="clock-ampm">--</span>{% endif %}
    </div>
    <div class="clock-date">Loading...</div>
</div>

<script>
(function() {
    // `root` is this instance's shadow root, given by the MirrorDash core; it survives re-renders
    const container = root.querySelector('.clock-container');
    if (!container) return;
    clearInterval(root._clockTimer);

    const format = container.getAttribute('data-format');
    const showSeconds = container.getAttribute('data-show-seconds') === 'true';
    const lang = container.getAttribute('data-lang');
    const timezone = container.getAttribute('data-timezone');
    const dateFormat = container.getAttribute('data-date-format') || 'full';

    const hmEl = container.querySelector('.clock-hm');
    const sEl = container.querySelector('.clock-s');
    const ampmEl = container.querySelector('.clock-ampm');
    const dateEl = container.querySelector('.clock-date');

    // Create datetime formatter options
    const timeOptions = {
        timeZone: timezone,
        hour: '2-digit',
        minute: '2-digit',
        hour12: format === '12h'
    };

    let timeFormatter;
    try {
        timeFormatter = new Intl.DateTimeFormat(lang, timeOptions);
    } catch (e) {
        console.warn('Clock module: Invalid locale or timezone, falling back to defaults.', e);
        timeFormatter = new Intl.DateTimeFormat(undefined, timeOptions);
    }

    let dateFormatter;
    if (dateFormat !== 'yyyy-MM-dd') {
        try {
            dateFormatter = new Intl.DateTimeFormat(lang, {
                timeZone: timezone,
                dateStyle: dateFormat
            });
        } catch (e) {
            console.warn('Clock module: Invalid locale or timezone for date, falling back to defaults.', e);
            dateFormatter = new Intl.DateTimeFormat(undefined, {
                dateStyle: dateFormat
            });
        }
    }

    // Only touch text that changed: rewriting the thin digits every second makes them shimmer
    function setText(el, text) {
        if (el && el.textContent !== text) el.textContent = text;
    }

    function updateClock() {
        const now = new Date();
        
        let hmStr = '--:--';
        let sStr = '';
        let ampmStr = '';

        try {
            const parts = timeFormatter.formatToParts(now);
            let hour = '';
            let minute = '';
            let dayPeriod = '';

            for (const part of parts) {
                if (part.type === 'hour') hour = part.value;
                else if (part.type === 'minute') minute = part.value;
                else if (part.type === 'dayPeriod') dayPeriod = part.value;
            }

            if (hour && minute) {
                if (hour.length === 1) hour = '0' + hour;
                if (minute.length === 1) minute = '0' + minute;
                hmStr = `${hour}:${minute}`;
            } else {
                throw new Error('Incomplete time parts');
            }
            if (format === '12h') {
                ampmStr = dayPeriod;
            }
        } catch (e) {
            // Fallback
            hmStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        if (showSeconds) {
            sStr = ':' + String(now.getSeconds()).padStart(2, '0');
        }

        setText(hmEl, hmStr);
        setText(sEl, sStr);
        setText(ampmEl, ampmStr);

        // Date formatting
        let dateStr = 'Loading...';
        if (dateFormat === 'yyyy-MM-dd') {
            try {
                const dateParts = new Intl.DateTimeFormat('en-US', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    timeZone: timezone
                }).formatToParts(now);

                let year = '';
                let month = '';
                let day = '';
                for (const part of dateParts) {
                    if (part.type === 'year') year = part.value;
                    else if (part.type === 'month') month = part.value;
                    else if (part.type === 'day') day = part.value;
                }
                dateStr = `${year}-${month}-${day}`;
            } catch (e) {
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                dateStr = `${year}-${month}-${day}`;
            }
        } else if (dateFormatter) {
            try {
                dateStr = dateFormatter.format(now);
                if (dateStr) {
                    dateStr = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
                }
            } catch (e) {
                dateStr = now.toDateString();
            }
        }

        setText(dateEl, dateStr);
    }

    updateClock();
    root._clockTimer = setInterval(updateClock, showSeconds ? 1000 : 10000);
})();
</script>

<style>
.clock-container {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    text-align: right;
    /* Every digit the same width, so the right-aligned time never shifts sideways when it changes */
    font-variant-numeric: tabular-nums;
}

.clock-time {
    display: flex;
    align-items: baseline;
}

/* The time is .display-xl and the seconds .headline-md .text-dimmed (modules.css) */
.clock-s {
    margin-left: 2px;
}

.clock-ampm {
    font-size: 20px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: 0.05em;
    color: var(--color-standard-gray, #999999);
    margin-left: 6px;
    align-self: flex-end;
    padding-bottom: 4px;
}

.clock-date {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.0;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-standard-gray, #999999);
    margin-top: var(--label-gap, 8px);
}
</style>
